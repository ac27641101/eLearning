<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<script src="../assets/gate.js?v=20261124b"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>五上數學 U8・整數四則運算</title>
<link rel="stylesheet" href="../assets/subject.css?v=20261124b">
</head>
<body>
<div class="sky-deco" aria-hidden="true">
<div class="cloud"></div>
<div class="cloud c2"></div>
</div>

<div class="app">
  <header class="topbar">
    <button type="button" class="px-btn home-btn" id="homeBtn" hidden>⬅ 回單元</button>
    <div class="title px" id="topTitle">✖️ 五上數學 U8・整數四則運算</div>
    <button type="button" class="px-btn mute-btn" id="muteBtn" aria-label="音效開關">🔊</button>
  </header>

  <section class="screen active" id="lobby">
    <h1 class="lobby-title" id="lobbyTitle">整數四則運算</h1>
    <p class="lobby-sub" id="lobbySub">五年級上學期數學｜第 8 單元　整數四則運算。點進小單元，用 30 顆星換 Switch 時間。</p>
    <div class="total px" id="totalStars"></div>
    <div class="portals" id="portals"></div>
    <a class="px-btn wood notes-btn" href="../#/math">⬅ 回科目</a>
  </section>

  <section class="screen" id="unit">
    <div class="level-head px"><h2 id="unitTitle"></h2><span class="chip" id="unitChip"></span></div>
    <p class="unit-desc px" id="unitDesc"></p>
    <section class="rules-strip" id="rulesStrip" aria-label="摘星換獎勵"></section>
    <section class="reward-peek" id="rewardPeek" aria-labelledby="rewardPeekTitle">
      <div class="peek-head">
        <h2 id="rewardPeekTitle">獎勵</h2>
        <p class="score-status" id="scoreStatus"></p>
      </div>
      <div class="score-bar" id="scoreBar" role="progressbar" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" aria-label="最好星星"><span></span></div>
      <div class="peek-grid" id="rewardList"></div>
      <p class="reward-hint" id="rewardHint" hidden></p>
    </section>
    <p class="run-note" id="runNote"></p>
    <div class="levels" id="levels"></div>
    <button type="button" class="px-btn orange notes-btn" id="restartRunBtn" hidden>🔁 這次重來</button>
    <button type="button" class="px-btn wood notes-btn" id="unitBackBtn">⬅ 回單元</button>
    <button type="button" class="px-btn wood reset-dock" id="resetBtn">🧹 清除星星紀錄</button>
  </section>

  <section class="screen" id="play">
    <p class="practice-banner" id="practiceBanner" hidden>練習模式，這次不會算星星</p>
    <div class="level-head px">
      <h2 id="lvTitle"></h2>
      <span class="chip" id="lvKind"></span>
      <span class="chip warn" id="lvTimer" hidden></span>
      <span class="chip" id="lvProg"></span>
    </div>
    <div class="ask px">
      <span id="lvAsk"></span>
      <button type="button" class="px-btn stone say-btn" id="sayBtn" aria-label="朗讀題目">🔈 唸給我聽</button>
    </div>
    <div class="stage" id="stage"></div>
  </section>
</div>

<div class="overlay" id="overlay"><div class="modal px" role="dialog" aria-modal="true" id="modal"></div></div>
<div class="reward-overlay" id="rewardOverlay" hidden>
  <div class="reward-sheet" role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
    <div id="rewardCard"></div>
    <p class="reward-tip" id="rewardTip">請父母點「父母簽名」後面的欄位，輸入帳號和密碼。核准後這張券就不能再使用。</p>
    <div class="reward-actions">
      <button type="button" class="px-btn wood" id="rewardPrint">🖨️ 列印獎勵卡</button>
      <button type="button" class="px-btn" id="rewardClose">收起來</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="assertive"></div>

<script src="../assets/unit-score.js?v=20261124b"></script>
<script src="../assets/reward-approve.js?v=20261124b"></script>
<script src="data.js?v=20261124b"></script>
<script src="../assets/subject-play.js?v=20261124b"></script>
<script src="game.js?v=20261124b"></script>
</body>
</html>
